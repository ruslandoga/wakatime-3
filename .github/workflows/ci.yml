name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      DUCKDB_VERSION: "1.5.4"

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Restore deps and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: test-${{ steps.beam.outputs.elixir-version }}-${{ github.head_ref || github.ref }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            test-${{ steps.beam.outputs.elixir-version }}-${{ github.head_ref || github.ref }}-
            test-${{ steps.beam.outputs.elixir-version }}-refs/heads/master-

      - name: Download DuckDB v${{ env.DUCKDB_VERSION }}
        run: |
          curl -LO https://github.com/duckdb/duckdb/releases/download/v${{ env.DUCKDB_VERSION }}/libduckdb-linux-amd64.zip
          unzip libduckdb-linux-amd64.zip -d libduckdb

      - run: mix deps.get --only $MIX_ENV
      - run: mix deps.get --check-locked
      - run: mix deps.unlock --check-unused

      - run: mix compile --warnings-as-errors
        env:
          DUXDB_CFLAGS: -I./libduckdb/
          DUXDB_LDFLAGS: -L./libduckdb -Wl,-rpath=./libduckdb

      - run: mix format --check-formatted
      - run: mix test

      - name: Restore PLTs cache
        uses: actions/cache@v6
        with:
          path: plts
          key: plts-${{ steps.beam.outputs.elixir-version }}-${{ github.head_ref || github.ref }}
          restore-keys: |
            plts-${{ steps.beam.outputs.elixir-version }}-refs/heads/master

      - run: mix dialyzer --format github
